<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TelaLive</title>
<style>
  :root {
    --bg: #121319;
    --panel: #1a1c25;
    --elevated: #20222c;
    --elevated-hover: #282b38;
    --rail: #0e0f14;
    --accent: #7c5cf6;
    --accent-hover: #9078ff;
    --danger: #f43f5e;
    --danger-hover: #fb7185;
    --success: #22c55e;
    --text: #f4f4f6;
    --muted: #9698a6;
    --border: #2a2d3a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(160deg, var(--accent), #5b3cc8);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-name { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }

  /* ---------- Autenticação ---------- */
  #auth-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  #auth-screen .brand { margin-bottom: 6px; }
  #auth-screen .brand-mark { width: 44px; height: 44px; border-radius: 13px; }
  #auth-screen .brand-name { font-size: 1.6rem; }
  .subtitle { color: var(--muted); margin: 0 0 26px; font-size: 0.95rem; text-align: center; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px; width: 100%; max-width: 380px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary-btn {
    width: 100%; padding: 13px 18px; border-radius: 10px; border: none;
    background: var(--accent); color: white; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled { background: #3a3d4d; cursor: not-allowed; }
  .switch-mode {
    text-align: center; margin-top: 16px; font-size: 0.88rem; color: var(--muted);
  }
  .switch-mode a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .switch-mode a:hover { text-decoration: underline; }
  .form-status { min-height: 18px; font-size: 0.85rem; color: var(--danger); margin-top: 10px; text-align: center; }

  /* ---------- App principal ---------- */
  #app-screen { display: none; flex: 1; min-height: 0; }

  .server-rail {
    width: 72px; background: var(--rail); flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 10px; overflow-y: auto;
  }
  .server-icon {
    width: 46px; height: 46px; border-radius: 16px; background: var(--elevated);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: var(--text); cursor: pointer;
    border: 2px solid transparent; transition: border-radius 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .server-icon:hover { border-radius: 14px; background: var(--elevated-hover); }
  .server-icon.active { border-radius: 14px; border-color: var(--accent); background: var(--accent); }
  .server-icon.add-btn { background: transparent; border: 2px dashed var(--border); color: var(--muted); font-size: 1.3rem; }
  .server-icon.add-btn:hover { border-color: var(--accent); color: var(--accent); }

  .channel-panel {
    width: 220px; background: var(--panel); border-right: 1px solid var(--border);
    flex-shrink: 0; display: flex; flex-direction: column; min-width: 0;
  }
  .channel-panel-header {
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  .channel-panel-header h2 {
    margin: 0 0 4px; font-size: 1rem; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .invite-hint { font-size: 0.75rem; color: var(--muted); cursor: pointer; }
  .invite-hint:hover { color: var(--text); }
  .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
  .channel-item {
    display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 0.92rem; margin-bottom: 2px;
  }
  .channel-item:hover { background: var(--elevated); color: var(--text); }
  .channel-item.active { background: var(--elevated); color: var(--text); font-weight: 600; }
  .channel-item .hash { opacity: 0.6; }
  .add-channel-btn {
    margin: 6px 10px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--border);
    background: transparent; color: var(--muted); font-size: 0.85rem; cursor: pointer; text-align: left;
  }
  .add-channel-btn:hover { border-color: var(--accent); color: var(--accent); }

  .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.95rem; text-align: center; padding: 20px;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .channel-title .hash { color: var(--muted); font-weight: 400; }

  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0; position: relative; overflow: auto;
  }
  .video-grid {
    display: grid; gap: 14px; width: 100%; height: 100%;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    align-content: center;
  }
  .video-tile {
    position: relative; background: #000; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); aspect-ratio: 16/9;
  }
  .video-tile video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .video-tile-label {
    position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,0.6);
    padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
  }
  #remote-video { max-width: 100%; max-height: 100%; border-radius: 12px; background: #000; display: none; }
  .waiting-state { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); text-align: center; padding: 0 20px; }
  .pulse-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .controlbar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; flex-shrink: 0; }
  .control-btn {
    display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--elevated); color: var(--text);
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .control-btn:hover { background: var(--elevated-hover); }
  .control-btn.primary { background: var(--accent); border-color: transparent; }
  .control-btn.primary:hover { background: var(--accent-hover); }
  .control-btn.danger { background: var(--danger); border-color: transparent; }
  .control-btn.danger:hover { background: var(--danger-hover); }
  .status-chip { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--muted); }
  .status-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

  /* ---------- Chat ---------- */
  .channel-body { flex: 1; display: flex; min-height: 0; }
  .call-column { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-column {
    width: 320px; flex-shrink: 0; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; background: var(--panel);
  }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .chat-empty { color: var(--muted); font-size: 0.85rem; text-align: center; margin-top: 20px; }
  .chat-msg { max-width: 100%; }
  .chat-msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .chat-msg-author { font-weight: 700; font-size: 0.85rem; }
  .chat-msg-author.me { color: var(--accent-hover); }
  .chat-msg-time { font-size: 0.7rem; color: var(--muted); }
  .chat-msg-text { font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-input-row input {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.9rem; min-width: 0;
  }
  .chat-input-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chat-send-btn {
    padding: 10px 16px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  .chat-send-btn:hover { background: var(--accent-hover); }

  /* ---------- Modal simples (criar/entrar em servidor, criar canal) ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 340px; }
  .modal h3 { margin: 0 0 14px; font-size: 1.05rem; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .secondary-btn {
    flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--elevated); color: var(--text); cursor: pointer; font-weight: 600;
  }
  .modal-actions .primary-btn { flex: 1; }
  .tab-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: transparent; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Login / Cadastro -->
<div id="auth-screen">
  <div class="brand">
    <div class="brand-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="16.5" r="2.1" fill="white"/>
        <path d="M6 13.5a8.5 8.5 0 0 1 12 0" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M3 10a12.6 12.6 0 0 1 18 0" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
      </svg>
    </div>
    <span class="brand-name">TelaLive</span>
  </div>
  <p class="subtitle" id="auth-subtitle">Entre para acessar seus servidores</p>

  <div class="card">
    <div class="field">
      <label for="auth-username">Nome de usuário</label>
      <input id="auth-username" autocomplete="username" />
    </div>
    <div class="field">
      <label for="auth-password">Senha</label>
      <input id="auth-password" type="password" autocomplete="current-password" />
    </div>
    <button id="auth-submit" class="primary-btn">Entrar</button>
    <p class="form-status" id="auth-status"></p>
    <p class="switch-mode" id="switch-mode">Não tem conta? <a id="switch-link">Criar uma agora</a></p>
  </div>
</div>

<!-- App principal -->
<div id="app-screen">
  <div class="server-rail" id="server-rail">
    <!-- ícones de servidor entram aqui via JS -->
    <div class="server-icon add-btn" id="add-server-btn" title="Adicionar servidor">+</div>
  </div>

  <div class="channel-panel">
    <div class="channel-panel-header">
      <h2 id="current-server-name">Selecione um servidor</h2>
      <div class="invite-hint hidden" id="invite-hint" title="Clique para copiar">Código: <strong id="invite-code"></strong></div>
    </div>
    <div class="channel-list" id="channel-list"></div>
    <button class="add-channel-btn hidden" id="add-channel-btn">+ Criar canal</button>
  </div>

  <div class="main-panel">
    <div class="empty-state" id="empty-state">Escolha ou crie um servidor pra começar</div>

    <div id="call-view" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
      <div class="topbar">
        <div class="channel-title"><span class="hash">#</span><span id="active-channel-name"></span></div>
        <div class="status-chip"><span class="dot"></span><span id="status-text">Conectado</span></div>
      </div>
      <div class="channel-body">
        <div class="call-column">
          <div class="stage">
            <div class="video-grid" id="video-grid"></div>
            <div class="waiting-state" id="waiting-state">
              <div class="pulse-dot"></div>
              <span id="waiting-text">Aguardando alguém entrar no canal...</span>
            </div>
          </div>
          <div class="controlbar">
            <button class="control-btn primary" id="share-btn">Compartilhar minha tela</button>
            <button class="control-btn danger hidden" id="stop-share-btn">Parar compartilhamento</button>
          </div>
        </div>
        <div class="chat-column">
          <div class="chat-messages" id="chat-messages">
            <p class="chat-empty" id="chat-empty">Nenhuma mensagem ainda. Diga oi!</p>
          </div>
          <div class="chat-input-row">
            <input id="chat-input" placeholder="Escreva uma mensagem..." maxlength="2000" />
            <button class="chat-send-btn" id="chat-send-btn">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: criar ou entrar em servidor -->
<div class="modal-backdrop hidden" id="server-modal">
  <div class="modal">
    <div class="tab-row">
      <button class="tab-btn active" id="tab-create-server">Criar servidor</button>
      <button class="tab-btn" id="tab-join-server">Entrar com código</button>
    </div>
    <div id="create-server-form">
      <div class="field">
        <label for="new-server-name">Nome do servidor</label>
        <input id="new-server-name" placeholder="Ex: Turma da rua" />
      </div>
    </div>
    <div id="join-server-form" class="hidden">
      <div class="field">
        <label for="join-server-code">Código de convite</label>
        <input id="join-server-code" placeholder="Cole o código aqui" />
      </div>
    </div>
    <p class="form-status" id="server-modal-status"></p>
    <div class="modal-actions">
      <button class="secondary-btn" id="server-modal-cancel">Cancelar</button>
      <button class="primary-btn" id="server-modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal: criar canal -->
<div class="modal-backdrop hidden" id="channel-modal">
  <div class="modal">
    <h3>Criar canal</h3>
    <div class="field">
      <label for="new-channel-name">Nome do canal</label>
      <input id="new-channel-name" placeholder="Ex: jogos" />
    </div>
    <p class="form-status" id="channel-modal-status"></p>
    <div class="modal-actions">
      <button class="secondary-btn" id="channel-modal-cancel">Cancelar</button>
      <button class="primary-btn" id="channel-modal-confirm">Criar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
